# =============================================================================
# Spilled Energy vs. single-pass baselines on TriviaQA. PRIMARY config.
#
# Run with:
#   HYDRA_CONFIG=$(pwd)/examples/configs/polygraph_eval_triviaqa_spilled_energy.yaml \
#     polygraph_eval
#
# Model:    Qwen/Qwen2.5-3B-Instruct, fp16, sdpa attention
# Dataset:  LM-Polygraph/triviaqa (continuation subset), test split
# Decoding: greedy (do_sample=false), max_new_tokens=20, stop on newline, 5-shot
# Quality:  AccuracyMetric = normalized exact match
# Metric:   normalized PRR@0.5 -> results key "prr_0.5_normalized"
# Seed:     1 (greedy decoding => deterministic given the seed)
#
# The constants here are what the reported numbers were produced with; override
# on the CLI for debugging only.
# =============================================================================

hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: qwen2.5-3b-instruct
  - estimators: spilled_energy_estimators
  - stat_calculators: auto_calculators
  - base_processing_triviaqa
  - _self_

cache_path: ./workdir/spilled_energy
save_path: '${hydra:run.dir}'

task: qa
instruct: false            # continuation-style few-shot, matching lm-polygraph's published TriviaQA protocol

# --- dataset ---------------------------------------------------------------
dataset: ['LM-Polygraph/triviaqa', 'continuation']
text_column: input
label_column: output
train_split: train
eval_split: test
few_shot_split: train
n_shot: 5
load_from_disk: false
trust_remote_code: false
multiref: true             # TriviaQA has multiple gold answers -> AggregatedMetric(max)
size: 10000                  # cap rows loaded before subsampling
subsample_eval_dataset: 1000 # n>=1000: at n=300 the PRR spread (~+-0.05) cannot
                             # support a baseline-vs-method claim. Override with
                             # --samples for quick debugging only, never for
                             # reported numbers.

# --- generation (frozen) ---------------------------------------------------
max_new_tokens: 20
generation_params:
  do_sample: false
  num_beams: 1
  temperature: 1.0
  stop_strings:
    - "\n"

# --- quality / correctness function ---------------------------------------
generation_metrics:
  - name: AccuracyMetric   # normalized exact match (with base_processing_triviaqa)

# --- caching: persist greedy generations so Stage 2 need not re-run the LLM --
save_stats:
  - greedy_texts
  - greedy_tokens
  - greedy_log_likelihoods
  # Persisted so the WITHIN-PASS invariant can be checked on real data:
  # tok - lse is a log-probability and must be <= 0 for every token. That one is
  # exact by construction, unlike the cross-pass identity against
  # greedy_log_likelihoods, which legitimately diverges in fp16 because the two
  # sides come from different forward passes.
  - energy_token_logits
  - energy_lse

# MUST stay false. transformers only applies its left-padding NaN guard
# (AttentionMaskConverter._unmask_unattended) when the attention implementation
# is sdpa AND output_attentions is False. Setting this true re-enables the fp16
# overflow that collapsed 108/150 generations to token 0. The attention-based
# baselines that need it run separately at batch_size=1 with eager, in
# polygraph_eval_triviaqa_spilled_energy_attention.yaml.
output_attentions: false

ignore_exceptions: false
batch_size: 4
seed:
  - 1
