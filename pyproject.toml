[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lm_polygraph"
version = "0.0.0"
authors = [
  { name = "List of contributors: https://github.com/IINemo/lm-polygraph/graphs/contributors", email = "artemshelmanov@gmail.com" },
]
description = "Uncertainty Estimation Toolkit for Transformer Language Models"
readme = "README.md"

keywords=["NLP", "deep learning", "transformer", "pytorch", "uncertainty estimation"]
license = {file = "LICENSE.md"}

requires-python = ">=3.10"
dynamic = ["dependencies"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/IINemo/lm-polygraph"
"Bug Tracker" = "https://github.com/IINemo/lm-polygraph/issues"
"Repository" = "https://github.com/IINemo/lm-polygraph"
"Documentation" = "https://lm-polygraph.readthedocs.io"

[project.optional-dependencies]
openai = ["openai>=1.52.0", "diskcache>=5.6.3"]
vllm = ["vllm>=0.8.0"]
quantization = ["bitsandbytes>=0.43.0"]
semantic = ["sentence-transformers>=3.0"]
nlp = ["spacy>=3.4.0", "nltk>=3.7,<4", "datasets>=2.19.0"]
boostedprob = ["boostedprob>=0.1.0"]
evaluation = [
  "datasets>=2.19.0", "pandas>=1.3.5", "rouge-score>=0.0.4",
  "sacrebleu>=1.5.0", "bert-score>=0.3.13", "evaluate>=0.4.2",
  "sentence-transformers>=3.0", "spacy>=3.4.0", "nltk>=3.7,<4",
  "matplotlib>=3.6", "absl-py>=1.0",
]
demo = ["flask>=2.3.2", "fschat>=0.2.3"]
dev = ["pytest>=7", "black>=24", "flake8>=7", "flake8-black>=0.3.6", "build>=1", "pip-tools>=7.4"]
comet = ["unbabel-comet<3"]

[tool.setuptools]
script-files = [
  "scripts/polygraph_eval",
  "scripts/polygraph_eval_ood",
  "scripts/polygraph_normalize",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
