[project]
name = "lm_polygraph"
version = "0.0.0"
authors = [
  { name = "List of contributors: https://github.com/IINemo/lm-polygraph/graphs/contributors", email = "artemshelmanov@gmail.com" },
]
description = "Uncertainty Estimation Toolkit for Transformer Language Models"
readme = "README.md"

keywords=["NLP", "deep learning", "transformer", "pytorch", "uncertainty estimation"]
license = {file = "LICENSE.md"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.32.1",
    "bert-score>=0.3.13",
    "bitsandbytes>=0.47.0",
    "bs4>=0.0.2",
    "datasets>=2.14.2",
    "dill>=0.3.5.1",
    "diskcache>=5.6.3",
    "einops>=0.8.1",
    "evaluate>=0.4.2",
    "fastchat>=0.1.0",
    "flask>=2.3.2",
    "fschat>=0.2.3",
    "hf-lfs>=0.0.3",
    "hf-transfer>=0.1.9",
    "hydra-core>=1.3.2",
    "matplotlib>=3.6",
    "nlpaug>=1.1.10",
    "nltk>=3.7,<4",
    "numpy>=1.23.5",
    "openai>=1.52.0",
    "pandas>=1.3.5",
    "pip>=25.2",
    "protobuf>=4.23",
    "pytest>=4.4.1",
    "pytreebank>=0.2.7",
    "rouge-score>=0.0.4",
    "sacrebleu>=1.5.0",
    "scikit-learn>=1.5.1",
    "scipy>=1.9.3",
    "sentence-transformers>=5.1.1",
    "sentencepiece>=0.1.97",
    "setuptools>=60.2.0",
    "spacy>=3.4.0,<3.8.0",
    "torch>=1.13.0",
    "tqdm>=4.64.1",
    "transformers>=4.48.0",
    "unbabel-comet==2.2.1",
    "vllm>=0.8.5.post1",
    "wget>=3.2",
    "wquantiles>=0.6",
]


[project.urls]
"Homepage" = "https://github.com/IINemo/lm-polygraph"
"Bug Tracker" = "https://github.com/IINemo/lm-polygraph/issues"
"Repository" = "https://github.com/IINemo/lm-polygraph"
"Documentation" = "https://lm-polygraph.readthedocs.io"

[tool.setuptools]
script-files = [
  "scripts/polygraph_eval",
  "scripts/polygraph_eval_ood",
  "scripts/polygraph_normalize",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.uv]
package = true
