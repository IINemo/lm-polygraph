name: Integration tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (vLLM requires a self-hosted GPU runner)'
        type: choice
        default: model-and-api
        options:
          - model-and-api
          - model
          - api
          - vllm

permissions:
  contents: read

jobs:
  model:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'model-and-api' || inputs.suite == 'model'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model test dependencies
        run: |
          python -m pip install --no-cache-dir '.[comet]'
      - name: Run model integration tests
        run: python -m pytest -m model test/test_lm_polygraph.py test/test_estimators.py test/test_high_level_api.py

  api:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'model-and-api' || inputs.suite == 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install --no-cache-dir .
      - name: Run API integration tests against local mock server
        run: python -m pytest -m api test/local/blackbox

  vllm:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'vllm'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vLLM test dependencies
        run: |
          python -m venv .venv-vllm
          .venv-vllm/bin/python -m pip install --no-cache-dir . vllm
      - name: Check CUDA availability
        run: .venv-vllm/bin/python -c "import torch; assert torch.cuda.is_available(), 'vLLM integration tests require CUDA'"
      - name: Run vLLM integration tests
        run: |
          source .venv-vllm/bin/activate
          python -m pytest -m vllm test/local/test_vllm.py
